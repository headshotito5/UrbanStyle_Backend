<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios y cortes de pelo</title>
</head>
<body>
    <h1>Servicios
         disponibles</h1>
    {% for servicio in servicio %}
        <div>
            <h3>{{ servicio.nombre }}</h3>
            <p>Precio: ${{ servicio.precio }}</p>
            <hr>
        </div>
        <p>No hay servicios disponibles.</p>
    {% endfor %}
</body>
</html>
