<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios y cortes de pelo</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style2.css' %}">
</head>
<body>
    <h1>Servicios
         disponibles</h1>
    {% for servicio in servicio %}
        <div>
            <h3>{{ servicio.servicio }}</h3>
            <p>Precio: ${{ servicio.precio }}</p>
            <p>Duración: {{ servicio.duracion }} minutos</p>
            <hr>
        </div>
    {% empty %}
        <p>No hay servicios disponibles.</p>
    {% endfor %}
</body>
</html>
