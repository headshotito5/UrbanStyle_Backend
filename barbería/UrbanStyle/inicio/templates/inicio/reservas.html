<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas UrbanStyle</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style2.css' %}">
</head>
<body>
    <h1>Reservas disponibles</h1>
    {% for reservas in reserva %}
        <div>
            <h3>{{ reservas.nombre_cliente }}</h3>
            <p>Servicio: {{ reservas.servicio }}</p>
            <hr>
        </div>
    {% empty %}
        <p>No hay reservas disponibles.</p>
    {% endfor %}
</body>
</html>
